[project]
name = "arm"
version = "0.1.0"
description = "SO-101 arm tooling on top of LeRobot: setup, teleop, record, train, eval"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "calibration_backups", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
